spring:
  application:
    name: customer-info
  cache:
    type: caffeine
    cache-names: customers, customerOrders, orderItems, customerByShippingAddress
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  main:
    banner-mode: off
  servlet:
    context-path: /customer-info
  datasource:
    url: jdbc:h2:mem:cust
    driverClassName: org.h2.Driver
    username: sa
    password: '123456'
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    generate-ddl: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  h2:
    console:
      enabled: true
      path: /h2
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: true
      suffix: .log
      prefix: access_log
      file-date-format: .yyyy-MM-dd
      directory: logs
      pattern: common
    threads:
      max: 200
      min-spare: 10

logging:
  level:
    org.apache.tomcat: DEBUG
    org.apache.catalina: DEBUG
    com.company.customerinfo: INFO
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  include-application-name: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,readinessDb
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      consume: W3C
      produce: W3C

app:
  health:
    db:
      max-latency-ms: 200
      max-active-ratio: 0.9
      max-waiting-threads: 0
  rate-limit:
    enabled: true
    cache:
      max-size: 100000
    default:
      capacity: 60
      refill-tokens: 60
      refill-period-seconds: 60
    profiles:
      write:
        capacity: 20
        refill-tokens: 20
        refill-period-seconds: 60
      read:
        capacity: 100
        refill-tokens: 100
        refill-period-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        registerHealthIndicator: true
        slidingWindowSize: 100
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5000ms
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.io.IOException
          - java.sql.SQLException
          - java.lang.Exception

  retry:
    instances:
      customerService:
        registerHealthIndicator: false
        maxAttempts: 3
        waitDuration: 1000ms
        retryExceptions:
          - java.io.IOException
          - java.sql.SQLException
        ignoreExceptions:
          - com.company.customerinfo.exception.ResourceNotFoundException

  timelimiter:
    instances:
      customerService:
        cancelRunningFuture: true
        timeoutDuration: 5000ms

  bulkhead:
    instances:
      customerService:
        maxConcurrentCalls: 50
        maxWaitDuration: 10ms

---
spring:
  config:
    activate:
      on-profile: prod
management:
  tracing:
    sampling:
      probability: 0.1
