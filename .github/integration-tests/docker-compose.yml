version: "3.9"

services:
  customer-info-app:
    build:
      context: ../..
      dockerfile: .github/integration-tests/Dockerfile
    image: customer-info-app:layer2-smoke
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_SERVLET_CONTEXT_PATH=/customer-info
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/customer-info/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"
